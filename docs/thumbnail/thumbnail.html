<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Inter:wght@500;600;700&display=block" rel="stylesheet">
<style>
:root{--ink:#1F2A2A;--paper:#F6F3EE;--teal:#2F6B66;--amber:#E0A33A;--clay:#E07A5F}
*{box-sizing:border-box;margin:0}
html,body{width:1500px;height:1000px;overflow:hidden;background:var(--ink);font-family:Inter,sans-serif;color:var(--paper)}
.bg{position:absolute;inset:0;background:radial-gradient(900px 700px at 78% 45%,#2f4544 0%,transparent 70%),radial-gradient(600px 500px at 0% 100%,#26302f 0%,transparent 70%)}
.left{position:absolute;left:90px;top:110px;width:700px}
.logo{display:flex;align-items:center;gap:22px}
.logo img{width:92px;height:92px;border-radius:24px}
.logo span{font:500 74px Fraunces,serif;letter-spacing:-.01em}
h1{font:500 92px/1.02 Fraunces,serif;margin-top:70px;letter-spacing:-.015em}
h1 em{color:var(--amber)}
.sub{font-size:34px;line-height:1.35;color:#cfd9d6;margin-top:34px;font-weight:500}
.pills{position:absolute;left:90px;bottom:90px;display:flex;gap:14px}
.pills b{font-weight:600;font-size:26px;padding:12px 24px;border-radius:999px;border:2px solid rgba(255,255,255,.25)}
.photo{position:absolute;right:120px;top:120px;width:470px;height:620px;border-radius:36px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45);border:6px solid rgba(255,255,255,.08)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.chip{position:absolute;background:var(--paper);color:var(--ink);border-radius:22px;padding:16px 24px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.chip small{display:block;font-size:17px;letter-spacing:.16em;text-transform:uppercase;color:#5d6b69;font-weight:700}
.chip strong{display:block;font:500 46px/1.05 Fraunces,serif;margin-top:4px}
.c1{right:470px;top:170px}.c2{right:70px;top:390px}.c3{right:500px;top:500px}
.match{position:absolute;right:150px;top:690px;background:var(--teal);color:#fff;border-radius:999px;padding:18px 32px;font-size:34px;font-weight:700;box-shadow:0 18px 40px rgba(0,0,0,.4);display:flex;align-items:center;gap:14px}
.match i{width:20px;height:20px;border-radius:50%;background:#9FD3C7;display:inline-block}
.yc{position:absolute;right:120px;bottom:90px;font-size:26px;color:#b9c7c3;font-weight:600}
.yc b{color:var(--paper)}
</style></head><body><div class="bg"></div>
<div class="left">
  <div class="logo"><img src="icon.png"><span>StrandLab</span></div>
  <h1>Stop guessing<br>your hair type.<br><em>Measure it.</em></h1>
  <div class="sub">Then shop only what suits it,<br>on any store.</div>
</div>
<div class="pills"><b>Installable PWA</b><b>17 languages</b><b>1-line store widget</b></div>
<div class="photo"><img src="maya.jpg"></div>
<div class="chip c1"><small>Curl pattern</small><strong>3B–3C</strong></div>
<div class="chip c2"><small>Frizz</small><strong>1 of 3</strong></div>
<div class="chip c3"><small>Density</small><strong>2.8 of 3</strong></div>
<div class="match"><i></i>91% match · suits your hair</div>
<div class="yc">Powered by <b>YouCam Hair AI</b></div>
</body></html>
